<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Começamos em breve · Desenvolvimento verificável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="espera.css">
</head>
<body>
  <main class="wait">
    <p class="wait-kicker">Desenvolvimento verificável com agentes de IA</p>
    <section class="wait-clock" aria-live="polite">
      <p class="wait-label" id="wait-label">Começamos em</p>
      <p class="wait-time" id="wait-time">10:00</p>
      <p class="wait-hint">Enquanto isso: abra o guia no chat e confira os pré-requisitos.</p>
    </section>
    <div class="globe" id="globe" aria-hidden="true"></div>
  </main>

  <script src="espera.js"></script>
</body>
</html>
